name: Bug report
description: Something does not work as expected
labels: [ bug ]
body:
  - type: input
    id: version
    attributes:
      label: RMediator version
    validations:
      required: true
  - type: input
    id: framework
    attributes:
      label: Target framework
      placeholder: net10.0
  - type: textarea
    id: description
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Code or a link to a repository that shows the problem.
      render: csharp
