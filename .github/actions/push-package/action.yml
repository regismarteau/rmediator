name: 'Pack and push Package'
description: 'Pack and push Package'

inputs:
  package:
    description: 'Package to push'
    required: true
  nuget-api-key:
    description: 'Nuget API key'
    required: true

runs:
  using: 'composite'
  steps:    
    - name: Pack project
      shell: 'bash'
      run: dotnet pack ${{ inputs.package }}/${{ inputs.package }}.csproj --configuration Release --output artifacts

    - name: NuGet push
      shell: 'bash'
      run: dotnet nuget push artifacts/*.nupkg --api-key ${{inputs.nuget-api-key}} --source https://api.nuget.org/v3/index.json