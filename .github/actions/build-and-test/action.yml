name: 'Install and build .NET'
description: 'Install and build .NET'

runs:
  using: 'composite'
  steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x
    - name: Install
      shell: bash
      run: dotnet restore
    - name: Build
      shell: bash
      run: dotnet build --no-restore --configuration Release
    - name: Test
      shell: bash
      run: dotnet test --no-restore --no-build --configuration Release