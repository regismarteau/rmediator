on:
  workflow_call:
    inputs:
      package:
        required: true
        type: string

jobs:
  pack-and-push:
    permissions:
      id-token: write
    runs-on: ubuntu-latest

    steps:        
      - name: Pack project
        run: dotnet pack ${{ inputs.package }}/${{ inputs.package }}.csproj --no-restore --no-build --configuration Release --output artifacts

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
    
      - name: NuGet push
        run: dotnet nuget push artifacts/*.nupkg --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json