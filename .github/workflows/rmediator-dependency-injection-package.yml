name: Push RMediator.DependencyInjection

on:
  push:
    branches: [ "main" ]
    paths: [ "RMediator.DependencyInjection/**" ]

jobs:
  push-rmediator-dependency-injection:
    permissions:
      id-token: write  
    runs-on: ubuntu-latest
    steps:
      - name: 'Build and test'
        uses: $/.github/actions/build-and-test
      - name: 'Push RMediator'
        uses: $/.github/actions/push-package
        with:
          package: "RMediator.DependencyInjection"
          nuget-user: ${{ secrets.NUGET_USER }}