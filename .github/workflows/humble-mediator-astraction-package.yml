name: Pack HumbleMediator.Abstractions

on:
  push:
    branches: [ "main" ]
    paths: [ "/not-yet/HumbleMediator.Abstractions" ]
  workflow_run:
    workflows: [build_and_test]
    types:
      - completed

jobs:
  publish-humble-mediator-abstractions-package:  
    uses: $/.github/workflows/push-package.yml
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    with:
      package: HumbleMediator.Abstractions