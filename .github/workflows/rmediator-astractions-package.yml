name: Push RMediator.Abstractions

on:
  push:
    branches: [ "main" ]
    paths: [ "RMediator.Abstractions/**" ]

jobs:
  push-rmediator-abstractions:
    permissions:
      id-token: write  
    runs-on: ubuntu-latest
    steps:
      - name: 'Build and test'
        uses: $/.github/actions/build-and-test
      - name: 'Push RMediator.Abstractions'
        uses: $/.github/actions/push-package
        with:
          package: "RMediator.Abstractions"
          nuget-api-key: ${{ secrets.NUGET_API_KEY }}