name: CI

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  workflow_call:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            9.0.x
      - name: Restore
        run: dotnet restore RMediator.slnx
      - name: Build
        run: dotnet build RMediator.slnx --no-restore --configuration Release
      - name: Test
        run: dotnet test RMediator.slnx --no-build --configuration Release
      - name: Pack
        run: dotnet pack RMediator.slnx --no-build --configuration Release --output artifacts
      - name: Check vulnerable dependencies
        run: |
          output=$(dotnet list RMediator.slnx package --vulnerable --include-transitive 2>&1)
          echo "$output"
          if echo "$output" | grep -q "has the following vulnerable packages"; then
            exit 1
          fi
